[package]
name = "fluffy-trees"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1.25.2"
console_error_panic_hook = "0.1.7"
glam = "0.34.3"
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "=0.3.106", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
] }
wgpu = { version = "27", default-features = false, features = ["std", "webgpu", "wgsl"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
